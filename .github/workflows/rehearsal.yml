name: Integrated software rehearsal
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: rehearsal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            integrations/signal-parent/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix integrations/signal-parent
      - name: Actual integrated rehearsal
        run: npm run rehearsal -- --output "$RUNNER_TEMP/dae-rehearsal"
      - name: Retain source-bound results and private-fixture test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rehearsal-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dae-rehearsal/report.json
            ${{ runner.temp }}/dae-rehearsal/SHA256SUMS
            ${{ runner.temp }}/dae-rehearsal/*.log
          if-no-files-found: error
          retention-days: 7
