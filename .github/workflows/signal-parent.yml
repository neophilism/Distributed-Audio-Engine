name: Signal parent integration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: signal-parent-${{ github.ref }}
  cancel-in-progress: true
jobs:
  signal-parent:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            integrations/signal-parent/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm ci --ignore-scripts --prefix integrations/signal-parent
      - run: npm run typecheck --prefix integrations/signal-parent
      - name: Endpoint and persistence tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signal-evidence
          npm test --prefix integrations/signal-parent | tee signal-evidence/endpoint-tests.tap
      - name: Actual Signal-to-native rendering
        shell: bash
        run: |
          set -euo pipefail
          sh integrations/signal-parent/test-native.sh | tee signal-evidence/native-tests.tap
      - name: Audit exact endpoint dependencies
        run: npm audit --prefix integrations/signal-parent --audit-level=moderate --json > signal-evidence/dependency-audit.json
      - name: Bind evidence to tested source
        if: always()
        shell: bash
        run: |
          mkdir -p signal-evidence
          git rev-parse HEAD > signal-evidence/SOURCE_COMMIT
          node --version > signal-evidence/NODE_VERSION
          cp integrations/signal-parent/package-lock.json signal-evidence/
          (cd signal-evidence && sha256sum *.tap *.json SOURCE_COMMIT NODE_VERSION > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: signal-parent-evidence-${{ github.sha }}
          path: signal-evidence/
          retention-days: 7
          if-no-files-found: error
